<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko pub — Marché Guinée</title>
  <link rel="stylesheet" href="pub-styles.css" />
  <style>
    .canvas {
      width: 1080px; height: 1080px;
      background: #fff;
      display: flex; flex-direction: column;
    }
    .gn-bar { height: 14px; flex-shrink: 0; }
    .main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 56px;
      background: radial-gradient(circle at 50% 30%, #FFF8E1 0%, #FAF8F5 55%, #fff 100%);
    }
    .elephant { width: 460px; height: 460px; margin-bottom: 12px; }
    .brand-name { font-size: 96px; }
    .hook { font-size: 48px; margin: 20px 0; }
    .sub { font-size: 30px; }
    .badges {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 24px; max-width: 880px;
    }
    .badge {
      background: #1A2E22; color: #fff; font-weight: 700;
      padding: 12px 22px; border-radius: 999px; font-size: 22px;
    }
    .footer {
      padding: 28px; display: flex; justify-content: center;
      background: #FAF8F5; border-top: 3px solid #E5E0D8;
    }
    .url-pill { font-size: 34px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="gn-bar"></div>
    <div class="main">
      <img class="elephant" src="../logo-icon-officiel.png" alt="Zokko" />
      <span class="brand-name">Zo<span class="k">kko</span></span>
      <p class="hook">Le marché de toute la Guinée</p>
      <p class="sub">Un site. Des annonces claires. Des vendeurs sur WhatsApp.</p>
      <div class="badges">
        <span class="badge">📱 Téléphones</span>
        <span class="badge">🚗 Voitures</span>
        <span class="badge">🏠 Maisons</span>
        <span class="badge">👗 Mode</span>
      </div>
    </div>
    <div class="footer">
      <span class="url-pill">www.zokko.net</span>
    </div>
    <div class="gn-bar"></div>
  </div>
  <p class="hint">Capture 1080×1080 · Image forte marque éléphant</p>
</body>
</html>
