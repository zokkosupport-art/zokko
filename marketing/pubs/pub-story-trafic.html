<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko — Story trafic</title>
  <link rel="stylesheet" href="pub-styles.css" />
  <style>
    .canvas {
      width: 1080px; height: 1920px;
      background: linear-gradient(180deg, #CE1126 0%, #FCD116 38%, #009460 72%, #1A2E22 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 120px 56px 80px;
    }
    .card {
      background: #fff; border-radius: 48px; padding: 48px 40px 56px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      width: 100%; max-width: 920px;
    }
    .elephant { width: 520px; height: 520px; margin-bottom: 8px; }
    .brand-name { font-size: 100px; }
    .hook { font-size: 56px; margin: 32px 0 20px; }
    .sub { font-size: 34px; }
    .url-pill {
      margin-top: 48px; font-size: 42px;
      background: #D84315; color: #fff;
    }
    .swipe {
      margin-top: auto; color: rgba(255,255,255,.9);
      font-size: 28px; font-weight: 700; letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="card">
      <img class="elephant" src="../logo-icon-officiel.png" alt="Zokko" />
      <span class="brand-name">Zo<span class="k">kko</span></span>
      <p class="hook">Swipe → les annonces<br />de Guinée</p>
      <p class="sub">Gratuit à parcourir · Prix en GNF · WhatsApp</p>
      <span class="url-pill">www.zokko.net</span>
    </div>
    <p class="swipe">🇬🇳 CONAKRY · KANKAN · LABÉ · KINDIA</p>
  </div>
  <p class="hint">Capture 1080×1920 · Story / Reel vertical</p>
</body>
</html>
