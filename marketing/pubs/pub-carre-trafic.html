<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko pub — Trafic carré</title>
  <link rel="stylesheet" href="pub-styles.css" />
  <style>
    .canvas {
      width: 1080px; height: 1080px;
      background: linear-gradient(165deg, #FAF8F5 0%, #fff 45%, #E8F5E9 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 48px 48px;
    }
    .hero { margin-top: 8px; margin-bottom: 28px; }
    .elephant { width: 420px; height: 420px; }
    .brand-name { font-size: 88px; }
    .hook { font-size: 52px; max-width: 900px; margin: 28px 0 16px; }
    .sub { font-size: 32px; max-width: 820px; }
    .gn-bar { width: 100%; margin-top: auto; border-radius: 6px; }
    .url-wrap { margin-top: 28px; }
    .url-pill { font-size: 38px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="hero">
      <img class="elephant" src="../logo-icon-officiel.png" alt="Zokko" />
    </div>
    <div class="brand-row">
      <span class="brand-name">Zo<span class="k">kko</span></span>
    </div>
    <p class="hook">Les annonces de Guinée,<br />au même endroit 🇬🇳</p>
    <p class="sub">Téléphones · Voitures · Maisons · Mode · Services<br />Prix en GNF · WhatsApp direct</p>
    <div class="url-wrap">
      <span class="url-pill">www.zokko.net</span>
    </div>
    <div class="gn-bar"></div>
  </div>
  <p class="hint">Capture 1080×1080 · Pub Meta trafic · Éléphant = marque</p>
</body>
</html>
