<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko pub — iPhone</title>
  <link rel="stylesheet" href="pub-styles.css" />
  <style>
    .canvas {
      width: 1080px; height: 1080px;
      background: #1A2E22;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 48px;
    }
    .left { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .elephant { width: 380px; height: 380px; background: #fff; border-radius: 48px; padding: 24px; }
    .right { color: #fff; padding-left: 24px; }
    .brand-name { font-size: 72px; color: #fff; }
    .brand-name .k { color: #FBC02D; }
    .hook { font-size: 44px; color: #fff; text-align: left; margin: 24px 0; }
    .sub { font-size: 28px; color: rgba(255,255,255,.75); text-align: left; }
    .url-pill { margin-top: 36px; background: #D84315; color: #fff; font-size: 32px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="left">
      <img class="elephant" src="../logo-icon-officiel.png" alt="Zokko" />
    </div>
    <div class="right">
      <div class="brand-name">Zo<span class="k">kko</span></div>
      <p class="hook">iPhone d’occasion<br />à Conakry ?</p>
      <p class="sub">Parcourez les annonces avec photos et prix en GNF. Contact WhatsApp en 1 clic.</p>
      <span class="url-pill">zokko.net</span>
    </div>
  </div>
  <p class="hint">Capture 1080×1080 · Ciblage électronique</p>
</body>
</html>
