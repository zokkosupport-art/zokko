<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko pub — Minimal éléphant</title>
  <link rel="stylesheet" href="pub-styles.css" />
  <style>
    .canvas {
      width: 1080px; height: 1080px;
      background: #D84315;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 64px;
    }
    .elephant {
      width: 560px; height: 560px;
      background: #fff;
      border-radius: 64px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .url-pill {
      margin-top: 48px;
      font-size: 44px;
      background: #fff;
      color: #1A2E22;
    }
    .tag {
      margin-top: 24px; color: rgba(255,255,255,.95);
      font-size: 32px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="elephant" src="../logo-icon-officiel.png" alt="Zokko — éléphant" />
    <span class="url-pill">www.zokko.net</span>
    <p class="tag">La marketplace 🇬🇳</p>
  </div>
  <p class="hint">Capture 1080×1080 · Marque = éléphant seul + URL</p>
</body>
</html>
