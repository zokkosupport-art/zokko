<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko — Reel 15s (éléphant marque)</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #000; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: system-ui, sans-serif;
    }
    .phone {
      width: 405px; height: 720px; position: relative; overflow: hidden;
      border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .slide {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 32px 20px; opacity: 0; animation: show 15s infinite;
      background: #FAF8F5;
    }
    .slide:nth-child(2) { background: #1A2E22; animation-delay: 5s; }
    .slide:nth-child(3) { background: linear-gradient(160deg, #CE1126, #FCD116, #009460); animation-delay: 10s; }
    @keyframes show {
      0%, 26% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    .slide:nth-child(1) { animation-delay: 0s; }
    .elephant {
      width: 200px; height: 200px; object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.15));
    }
    .slide:nth-child(2) .elephant {
      background: #fff; border-radius: 36px; padding: 16px;
    }
    h1 { font-size: 34px; font-weight: 900; color: #1A2E22; margin-top: 20px; line-height: 1.1; }
    h1 .k { color: #D84315; }
    .slide:nth-child(2) h1, .slide:nth-child(2) p { color: #fff; }
    .slide:nth-child(2) h1 .k { color: #FBC02D; }
    p { font-size: 20px; margin-top: 12px; color: #4A5D50; font-weight: 600; }
    .url {
      margin-top: 24px; font-size: 22px; font-weight: 800;
      background: #D84315; color: #fff; padding: 12px 28px; border-radius: 999px;
    }
    .slide:nth-child(3) .url { background: #1A2E22; color: #FCD116; }
    .hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #888; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="slide">
      <img class="elephant" src="logo-icon-officiel.png" alt="Zokko" />
      <h1>Zo<span class="k">kko</span> 🇬🇳</h1>
      <p>Les annonces de Guinée</p>
    </div>
    <div class="slide">
      <img class="elephant" src="logo-icon-officiel.png" alt="Zokko" />
      <h1>Parcourez<br /><span class="k">gratuitement</span></h1>
      <p>iPhone · Voiture · Maison · Mode</p>
    </div>
    <div class="slide">
      <img class="elephant" src="logo-icon-officiel.png" alt="Zokko" style="background:#fff;border-radius:36px;padding:16px;" />
      <div class="url">www.zokko.net</div>
    </div>
  </div>
  <p class="hint">▶ Enregistrez l’écran 15 s · L’éléphant = toute la marque</p>
</body>
</html>
