<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko — Reel 15s (logo officiel)</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #000; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: system-ui, Segoe UI, sans-serif;
    }
    .phone {
      width: 405px; height: 720px; position: relative; overflow: hidden;
      border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      background: #fff;
    }
    .slide {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 36px 24px; opacity: 0; animation: show 15s infinite;
    }
    .slide:nth-child(1) { animation-delay: 0s; }
    .slide:nth-child(2) { animation-delay: 5s; }
    .slide:nth-child(3) { animation-delay: 10s; }
    @keyframes show {
      0%, 26% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    .logo-wrap img { width: 200px; height: auto; object-fit: contain; }
    h1 { font-size: 32px; font-weight: 900; color: #1A2E22; line-height: 1.2; margin-top: 20px; }
    h1 span { color: #CE1126; }
    .bar {
      margin-top: 16px; padding: 10px 20px; border-radius: 10px;
      background: linear-gradient(90deg, #CE1126, #FCD116, #009460);
      color: #fff; font-size: 20px; font-weight: 800;
    }
    p { font-size: 20px; margin-top: 14px; color: #4A5D50; font-weight: 600; }
    .url {
      font-size: 22px; font-weight: 800; background: #009460; color: #fff;
      padding: 12px 28px; border-radius: 999px; margin-top: 20px;
    }
    .hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="slide">
      <div class="logo-wrap"><img src="logo-icon-officiel.png" alt="Zokko" /></div>
      <h1><span>Zokko</span> 🇬🇳</h1>
      <p class="bar">Marketplace Guinée</p>
      <p>Parcourez les annonces</p>
    </div>
    <div class="slide" style="background: linear-gradient(160deg, #009460, #FCD116, #CE1126);">
      <p style="font-size:42px;font-weight:900;color:#fff;">iPhone · Toyota · Mode</p>
      <p style="color:#fff;font-size:22px;margin-top:20px;">Prix en GNF sur un seul site</p>
    </div>
    <div class="slide">
      <div class="logo-wrap"><img src="logo-icon-officiel.png" alt="Logo Zokko officiel" /></div>
      <h1>Ouvrez maintenant</h1>
      <div class="url">www.zokko.net</div>
    </div>
  </div>
  <p class="hint">▶ Enregistrez l'écran 15 s · Logo officiel éléphant tricolore</p>
</body>
</html>
