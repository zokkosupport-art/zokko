<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Zokko — Couverture Facebook</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #333; display: flex; justify-content: center; padding: 20px; }
    .cover {
      width: 1640px; height: 624px; background: #fff; position: relative; overflow: hidden;
      display: flex; align-items: center; padding: 0 80px; gap: 48px;
    }
    .cover::before {
      content: ""; position: absolute; top: 0; left: 0; width: 280px; height: 120px;
      background: #CE1126; border-radius: 0 0 80% 0;
    }
    .cover::after {
      content: ""; position: absolute; top: 0; right: 0; width: 280px; height: 120px;
      background: #FCD116; border-radius: 0 0 0 80%;
    }
    .logo img { height: 320px; width: auto; position: relative; z-index: 1; }
    .text { position: relative; z-index: 1; }
    .text h1 { font-size: 64px; font-weight: 900; color: #1A2E22; }
    .text h1 span { color: #CE1126; }
    .text p { font-size: 32px; color: #4A5D50; margin-top: 12px; }
    .url { margin-top: 20px; display: inline-block; background: #009460; color: #fff; font-size: 28px; font-weight: 800; padding: 12px 32px; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="logo">
      <img src="logo-officiel.png" alt="Zokko" style="clip-path: inset(0 0 50% 0); margin-top: -40px;" />
    </div>
    <div class="text">
      <h1><span>Zokko</span> — Guinée 🇬🇳</h1>
      <p>Marketplace · Annonces · WhatsApp</p>
      <span class="url">www.zokko.net</span>
    </div>
  </div>
</body>
</html>
